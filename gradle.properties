# Project-wide Gradle properties.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.experimental.lint.missingBaselineIsEmptyBaseline=true
android.suppressUnsupportedCompileSdk=35,36
# AGP 9 migration: keep the classic Kotlin plugin (kapt, kotlinOptions) and the legacy variant API
# (android.applicationVariants is used by the native-lib RELRO patch task) until those are ported.
android.builtInKotlin=false
android.newDsl=false
